<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">01 / Origin — Bharat Poojari</title>
  <desc id="desc">A standalone animated portfolio origin section with editorial typography, animated spectrum underline, staggered information cards, a kinetic waveform, and a rotating technical compass. Designed as a distinct section, not a hero banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset=".55" stop-color="#101522"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63e6be"/>
      <stop offset=".48" stop-color="#6dd5fa"/>
      <stop offset="1" stop-color="#c7a2ff"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".65" stop-color="#dce7f6"/>
      <stop offset="1" stop-color="#83e8e2"/>
    </linearGradient>
    <radialGradient id="wash">
      <stop offset="0" stop-color="#4dd9cb" stop-opacity=".12"/>
      <stop offset="1" stop-color="#4dd9cb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b6c4d8" opacity=".15"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="680" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="680" fill="url(#bg)"/>
    <rect width="1200" height="680" fill="url(#dots)"/>
    <ellipse cx="1030" cy="150" rx="330" ry="270" fill="url(#wash)">
      <animate attributeName="opacity" values=".45;.9;.45" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M0 618 C240 580 340 695 570 645 S930 588 1200 630" fill="none" stroke="#6dd5fa" stroke-opacity=".08" stroke-width="1.5"/>

    <!-- Section label -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="58" y="58" fill="#83e8e2" font-size="12" letter-spacing="3.5">PROFILE INDEX</text>
      <path d="M58 76H1142" stroke="#dce7f6" stroke-opacity=".16"/>
      <text x="1142" y="58" text-anchor="end" fill="#8290a7" font-size="11" letter-spacing="2">B.P. / 001</text>
    </g>
    <text x="58" y="148" fill="url(#accent)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.8">01</text>
    <path d="M96 141H150" stroke="url(#accent)" stroke-width="2"/>
    <text x="166" y="148" fill="#d7e1f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3">ORIGIN</text>

    <!-- Editorial identity block -->
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
      <text x="58" y="218" fill="#8391a8" font-size="13" font-weight="600" letter-spacing="3">HEY, I'M</text>
      <text x="54" y="290" fill="url(#name)" font-size="66" font-weight="800" letter-spacing="-3">Bharat Poojari<tspan fill="#83e8e2">.</tspan></text>
      <text x="60" y="327" fill="#dce7f6" font-size="20" font-weight="500">BCA Graduate <tspan fill="#64748b">/</tspan> <tspan fill="#83e8e2">Full-Stack Developer</tspan></text>
      <g transform="translate(60 354)">
        <path d="M0 0l7 7-7 7-7-7Z" fill="#c7a2ff"/>
        <text x="20" y="11" fill="#aab7cb" font-size="14" letter-spacing=".6">Sirsi, Karnataka, India</text>
      </g>
      <path d="M60 389H675" stroke="#dce7f6" stroke-opacity=".15"/>
      <path d="M60 389H220" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="160" stroke-dashoffset="160">
        <animate attributeName="stroke-dashoffset" values="160;0;0" keyTimes="0;.65;1" dur="4s" repeatCount="indefinite"/>
      </path>
      <text x="60" y="424" fill="#bdc8d9" font-size="15.5">
        <tspan x="60" dy="0">I turn ideas into practical digital products — from responsive</tspan>
        <tspan x="60" dy="25">web experiences and backend workflows to desktop tools and</tspan>
        <tspan x="60" dy="25">AI-assisted applications. I care about the whole experience:</tspan>
        <tspan x="60" dy="25">clear interfaces, maintainable code, and workflows that make</tspan>
        <tspan x="60" dy="25">sense from the first click to the final task.</tspan>
      </text>
    </g>

    <!-- Right-side kinetic compass: deliberately different from an orbital hero -->
    <g transform="translate(930 260)">
      <circle r="150" fill="#0b111d" stroke="#dce7f6" stroke-opacity=".12"/>
      <circle r="130" fill="none" stroke="#dce7f6" stroke-opacity=".12" stroke-dasharray="2 8"/>
      <circle r="108" fill="none" stroke="#83e8e2" stroke-opacity=".25" stroke-dasharray="34 12">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#6dd5fa" stroke-opacity=".35" stroke-width="1">
        <path d="M0 -142V-118M0 118V142M-142 0H-118M118 0H142"/>
        <path d="M-100 -100l17 17M83 83l17 17M100 -100L83 -83M-83 83l-17 17"/>
      </g>
      <g transform="rotate(0)">
        <path d="M0 -79L19 -9L0 8L-19 -9Z" fill="#83e8e2" fill-opacity=".85"/>
        <path d="M0 79L-19 9L0 -8L19 9Z" fill="#c7a2ff" fill-opacity=".65"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      </g>
      <circle r="38" fill="#0d1724" stroke="url(#accent)" stroke-width="1.5"/>
      <circle r="25" fill="none" stroke="#83e8e2" stroke-opacity=".45" stroke-dasharray="3 5"/>
      <text x="0" y="-3" text-anchor="middle" fill="#f1f5f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">BP</text>
      <text x="0" y="14" text-anchor="middle" fill="#83e8e2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" letter-spacing="1.5">ORIGIN</text>
      <circle cx="0" cy="-130" r="4" fill="#83e8e2" filter="url(#softGlow)">
        <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="91" cy="66" r="3" fill="#c7a2ff" filter="url(#softGlow)">
        <animate attributeName="opacity" values=".25;1;.25" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-110" cy="43" r="2.5" fill="#6dd5fa">
        <animate attributeName="opacity" values="1;.2;1" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="184" text-anchor="middle" fill="#8190a7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">CURIOUS BY DESIGN</text>
    </g>

    <!-- Compact animated signal waveform -->
    <g transform="translate(770 482)" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="2">
      <path d="M0 0h18l7 -10 8 20 9 -28 9 38 9 -22 8 12 8 -5h18" opacity=".75">
        <animate attributeName="stroke-dasharray" values="0 120;120 0;0 120" dur="5s" repeatCount="indefinite"/>
      </path>
      <text x="0" y="38" fill="#8a98ae" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.5">SIGNAL / ITERATION</text>
    </g>

    <!-- Four distinct content cards -->
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
      <g transform="translate(60 566)">
        <rect width="258" height="76" rx="12" fill="#101a27" fill-opacity=".9" stroke="#83e8e2" stroke-opacity=".42"/>
        <rect x="0" y="0" width="3" height="76" rx="1.5" fill="#83e8e2"/>
        <text x="18" y="24" fill="#83e8e2" font-size="11" font-weight="800" letter-spacing="1.8">BUILDING</text>
        <text x="18" y="45" fill="#d5dfed" font-size="12.5">Web apps, developer tools</text>
        <text x="18" y="62" fill="#d5dfed" font-size="12.5">&amp; AI-powered experiences</text>
        <rect x="230" y="14" width="8" height="8" rx="2" fill="#83e8e2">
          <animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g transform="translate(332 566)">
        <rect width="258" height="76" rx="12" fill="#101a27" fill-opacity=".9" stroke="#6dd5fa" stroke-opacity=".42"/>
        <rect x="0" y="0" width="3" height="76" rx="1.5" fill="#6dd5fa"/>
        <text x="18" y="24" fill="#6dd5fa" font-size="11" font-weight="800" letter-spacing="1.8">INTERESTED IN</text>
        <text x="18" y="45" fill="#d5dfed" font-size="12.5">Full-stack, AI integration,</text>
        <text x="18" y="62" fill="#d5dfed" font-size="12.5">interface design &amp; automation</text>
        <circle cx="235" cy="18" r="4" fill="none" stroke="#6dd5fa">
          <animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g transform="translate(604 566)">
        <rect width="258" height="76" rx="12" fill="#101a27" fill-opacity=".9" stroke="#c7a2ff" stroke-opacity=".42"/>
        <rect x="0" y="0" width="3" height="76" rx="1.5" fill="#c7a2ff"/>
        <text x="18" y="24" fill="#c7a2ff" font-size="11" font-weight="800" letter-spacing="1.8">APPROACH</text>
        <text x="18" y="45" fill="#d5dfed" font-size="12.5">Understand → design → build</text>
        <text x="18" y="62" fill="#d5dfed" font-size="12.5">→ test → refine → ship</text>
        <path d="M226 18h14m-5 -5l5 5-5 5" stroke="#c7a2ff" stroke-width="1.4" fill="none">
          <animateTransform attributeName="transform" type="translate" values="-2 0;3 0;-2 0" dur="2.2s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(876 566)">
        <rect width="264" height="76" rx="12" fill="#101a27" fill-opacity=".9" stroke="#f5bd72" stroke-opacity=".42"/>
        <rect x="0" y="0" width="3" height="76" rx="1.5" fill="#f5bd72"/>
        <text x="18" y="24" fill="#f5bd72" font-size="11" font-weight="800" letter-spacing="1.8">EXPLORING</text>
        <text x="18" y="45" fill="#d5dfed" font-size="12.5">Better ways to connect</text>
        <text x="18" y="62" fill="#d5dfed" font-size="12.5">thoughtful UX with engineering</text>
        <path d="M235 12l2.8 6 6.2.8-4.5 4.3 1.1 6.1-5.6-3-5.6 3 1.1-6.1-4.5-4.3 6.2-.8Z" fill="#f5bd72" opacity=".8">
          <animateTransform attributeName="transform" type="rotate" values="0 235 20;18 235 20;0 235 20" dur="4s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- Footer line and motto -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.8">
      <text x="60" y="661" fill="#8190a7">IDEAS</text>
      <path d="M111 657h28" stroke="#6dd5fa" stroke-width="1.2"/>
      <text x="151" y="661" fill="#8190a7">PRODUCTS</text>
      <path d="M228 657h28" stroke="#6dd5fa" stroke-width="1.2"/>
      <text x="268" y="661" fill="#83e8e2">IMPACT</text>
      <text x="1140" y="661" text-anchor="end" fill="#71809a">BUILD WITH INTENTION</text>
    </g>
    <rect x=".6" y=".6" width="1198.8" height="678.8" rx="23.4" fill="none" stroke="#a8bfd2" stroke-opacity=".22" stroke-width="1.2"/>
  </g>
</svg>

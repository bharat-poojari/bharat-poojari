<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Bharat Poojari — Full-stack developer</title>
  <desc id="desc">A dark futuristic developer banner with cyan and violet orbital lines, a glowing geometric core, and the tagline Thoughtful software. Built for people.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/><stop offset=".55" stop-color="#11152a"/><stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8be9fd"/><stop offset=".55" stop-color="#bd93f9"/><stop offset="1" stop-color="#ff79c6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8be9fd" stop-opacity=".22"/><stop offset="1" stop-color="#8be9fd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#91a4c5" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="390" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="20" fill="url(#grid)"/>
  <circle cx="920" cy="190" r="260" fill="url(#glow)"/>
  <g fill="none" stroke="url(#line)" stroke-width="1.4" opacity=".68">
    <ellipse cx="930" cy="190" rx="190" ry="66" transform="rotate(-26 930 190)"/>
    <ellipse cx="930" cy="190" rx="190" ry="66" transform="rotate(32 930 190)"/>
    <ellipse cx="930" cy="190" rx="140" ry="140" transform="rotate(22 930 190)" stroke-dasharray="5 9"/>
    <path d="M760 190H1100M930 36V344" stroke-opacity=".25" stroke-dasharray="3 8"/>
  </g>
  <g filter="url(#softGlow)">
    <path d="M930 108 1000 149 1000 231 930 272 860 231 860 149Z" fill="#111b31" stroke="#8be9fd" stroke-width="1.8"/>
    <path d="M930 128 980 157 980 219 930 248 880 219 880 157Z" fill="none" stroke="#bd93f9" stroke-width="1.4"/>
    <path d="M930 153 958 169 958 207 930 223 902 207 902 169Z" fill="#8be9fd" fill-opacity=".14" stroke="#8be9fd" stroke-width="1.5"/>
    <circle cx="930" cy="188" r="6" fill="#8be9fd"/>
  </g>
  <g fill="#8be9fd">
    <circle cx="785" cy="111" r="3"/><circle cx="1065" cy="118" r="2.5"/><circle cx="1052" cy="272" r="3"/>
    <circle cx="825" cy="286" r="2"/><circle cx="1015" cy="75" r="2"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="67" fill="#8be9fd" font-size="13" letter-spacing="4">PORTFOLIO / 2026</text>
    <path d="M64 88H124" stroke="#8be9fd" stroke-width="2"/>
    <text x="60" y="157" fill="#f1f5f9" font-size="47" font-weight="700" letter-spacing="-1.5">BHARAT</text>
    <text x="60" y="211" fill="#f1f5f9" font-size="47" font-weight="700" letter-spacing="-1.5">POOJARI<tspan fill="#8be9fd">.</tspan></text>
    <text x="64" y="253" fill="#bdc9dd" font-size="17">FULL-STACK DEVELOPER</text>
    <text x="64" y="294" fill="#8be9fd" font-size="15">Thoughtful software. Built for people.</text>
    <text x="64" y="351" fill="#8794ae" font-size="11" letter-spacing="2">SIRSI, INDIA  /  BUILD • REFINE • SHIP</text>
    <text x="1090" y="350" fill="#8794ae" font-size="10" text-anchor="end">BP // 001</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="389" rx="19.5" fill="none" stroke="#8be9fd" stroke-opacity=".25"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">02 / Selected Work — Bharat Poojari</title>
  <desc id="desc">A standalone animated projects section featuring OffyAI, Furniqo, CodePolish, and additional experiments with project descriptions, live source links, stack badges, animated card borders, and a moving progress beam.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b13"/>
      <stop offset=".55" stop-color="#101624"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8be9fd"/>
      <stop offset=".5" stop-color="#bd93f9"/>
      <stop offset="1" stop-color="#ff79c6"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50fa7b"/>
      <stop offset="1" stop-color="#8be9fd"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#a9b8d0" stroke-opacity=".055" stroke-width=".7"/>
      <circle cx="0" cy="0" r="1" fill="#8be9fd" fill-opacity=".12"/>
    </pattern>
    <radialGradient id="haze">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".14"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="760"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .muted { fill: #93a2ba; }
      .body { fill: #c6d0e0; font-size: 13.5px; }
      .cardTitle { fill: #f4f7fb; font-size: 25px; font-weight: 800; letter-spacing: -.8px; }
      .chip { fill: #0b1220; stroke-width: 1; }
      .link { fill: #8be9fd; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="760" fill="url(#bg)"/>
    <rect width="1200" height="760" fill="url(#grid)"/>
    <ellipse cx="1020" cy="130" rx="330" ry="250" fill="url(#haze)">
      <animate attributeName="opacity" values=".6;1;.6" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Section header -->
    <g class="mono">
      <circle cx="60" cy="48" r="4" fill="#8be9fd">
        <animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="76" y="52" fill="#8be9fd" font-size="11" letter-spacing="3">WORK INDEX / 2026</text>
      <text x="1140" y="52" text-anchor="end" fill="#73829b" font-size="10" letter-spacing="2">SELECTED SYSTEMS — 04</text>
    </g>
    <text x="56" y="129" class="sans" fill="#f4f7fb" font-size="53" font-weight="850" letter-spacing="-2.8">Selected <tspan fill="url(#spectrum)">Work.</tspan></text>
    <text x="60" y="165" class="sans" fill="#aebbd0" font-size="16">A selection of projects exploring different parts of the software stack.</text>
    <path d="M60 190H1140" stroke="#a9b8d0" stroke-opacity=".18"/>
    <path d="M60 190H260" stroke="url(#spectrum)" stroke-width="2.2" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 200;200 0;0 200" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- Card 01: OffyAI -->
    <g transform="translate(60 220)">
      <rect width="525" height="224" rx="15" fill="#0b111d" fill-opacity=".93" stroke="#8be9fd" stroke-opacity=".32"/>
      <rect x="1" y="1" width="523" height="222" rx="14" fill="none" stroke="#8be9fd" stroke-opacity=".07"/>
      <path d="M18 0H95" stroke="#8be9fd" stroke-width="2.4" stroke-linecap="round">
        <animate attributeName="stroke-dasharray" values="0 77;77 0;0 77" dur="5s" repeatCount="indefinite"/>
      </path>
      <g class="mono" font-size="10" letter-spacing="1.5">
        <text x="22" y="28" fill="#8be9fd">PROJECT / 01</text>
        <text x="503" y="28" fill="#70819b" text-anchor="end">DESKTOP • LOCAL AI</text>
      </g>
      <g transform="translate(23 51)">
        <rect width="48" height="48" rx="12" fill="#0e2431" stroke="#8be9fd" stroke-opacity=".6"/>
        <path d="M12 14h24v20H12zM17 20h14M17 25h10M17 30h7" fill="none" stroke="#8be9fd" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="36" cy="13" r="3" fill="#50fa7b" filter="url(#glow)"/>
      </g>
      <text x="86" y="70" class="sans cardTitle">OffyAI</text>
      <text x="86" y="92" class="sans" fill="#8be9fd" font-size="12.5" font-weight="600">Local-first AI desktop app for Windows</text>
      <text x="24" y="125" class="sans body">
        <tspan x="24" dy="0">Exploring local AI workflows through a desktop-first</tspan>
        <tspan x="24" dy="20">experience, with an emphasis on local model workflows.</tspan>
      </text>
      <a href="https://offyai.vercel.app/" target="_blank" rel="noopener">
        <text x="24" y="175" class="sans link">↗ Product site</text>
      </a>
      <text x="114" y="175" class="sans muted" font-size="12">·</text>
      <a href="https://github.com/bharat-poojari/offyai" target="_blank" rel="noopener">
        <text x="129" y="175" class="sans link">↗ Source code</text>
      </a>
      <g class="mono" font-size="9.5" font-weight="700" letter-spacing=".8">
        <rect x="24" y="188" width="102" height="23" rx="5" class="chip" stroke="#8be9fd" stroke-opacity=".45"/>
        <text x="75" y="203" fill="#8be9fd" text-anchor="middle">DESKTOP</text>
        <rect x="135" y="188" width="94" height="23" rx="5" class="chip" stroke="#50fa7b" stroke-opacity=".45"/>
        <text x="182" y="203" fill="#50fa7b" text-anchor="middle">LOCAL AI</text>
      </g>
    </g>

    <!-- Card 02: Furniqo -->
    <g transform="translate(615 220)">
      <rect width="525" height="224" rx="15" fill="#0b111d" fill-opacity=".93" stroke="#bd93f9" stroke-opacity=".34"/>
      <path d="M18 0H95" stroke="#bd93f9" stroke-width="2.4" stroke-linecap="round">
        <animate attributeName="stroke-dasharray" values="0 77;77 0;0 77" dur="5.7s" repeatCount="indefinite"/>
      </path>
      <g class="mono" font-size="10" letter-spacing="1.5">
        <text x="22" y="28" fill="#cdb2ff">PROJECT / 02</text>
        <text x="503" y="28" fill="#70819b" text-anchor="end">COMMERCE • 3D</text>
      </g>
      <g transform="translate(23 51)">
        <rect width="48" height="48" rx="12" fill="#1c1530" stroke="#bd93f9" stroke-opacity=".65"/>
        <path d="M13 18l11-6 11 6-11 6zM13 18v13l11 6 11-6V18M24 24v13" fill="none" stroke="#cdb2ff" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="36" cy="13" r="3" fill="#ff79c6" filter="url(#glow)"/>
      </g>
      <text x="86" y="70" class="sans cardTitle">Furniqo</text>
      <text x="86" y="92" class="sans" fill="#cdb2ff" font-size="12.5" font-weight="600">3D furniture commerce experience</text>
      <text x="24" y="125" class="sans body">
        <tspan x="24" dy="0">An e-commerce concept centered on immersive 3D</tspan>
        <tspan x="24" dy="20">product visualization, responsive shopping flows,</tspan>
        <tspan x="24" dy="20">and polished interactions.</tspan>
      </text>
      <a href="https://github.com/bharat-poojari/Furniqo" target="_blank" rel="noopener">
        <text x="24" y="175" class="sans link">↗ Explore source</text>
      </a>
      <g class="mono" font-size="9.5" font-weight="700" letter-spacing=".8">
        <rect x="24" y="188" width="76" height="23" rx="5" class="chip" stroke="#8be9fd" stroke-opacity=".45"/>
        <text x="62" y="203" fill="#8be9fd" text-anchor="middle">REACT</text>
        <rect x="109" y="188" width="96" height="23" rx="5" class="chip" stroke="#e5e7eb" stroke-opacity=".35"/>
        <text x="157" y="203" fill="#e5e7eb" text-anchor="middle">THREE.JS</text>
      </g>
    </g>

    <!-- Card 03: CodePolish -->
    <g transform="translate(60 462)">
      <rect width="525" height="224" rx="15" fill="#0b111d" fill-opacity=".93" stroke="#50fa7b" stroke-opacity=".3"/>
      <path d="M18 0H95" stroke="#50fa7b" stroke-width="2.4" stroke-linecap="round">
        <animate attributeName="stroke-dasharray" values="0 77;77 0;0 77" dur="5.2s" repeatCount="indefinite"/>
      </path>
      <g class="mono" font-size="10" letter-spacing="1.5">
        <text x="22" y="28" fill="#50fa7b">PROJECT / 03</text>
        <text x="503" y="28" fill="#70819b" text-anchor="end">EDITOR • DEV TOOLS</text>
      </g>
      <g transform="translate(23 51)">
        <rect width="48" height="48" rx="12" fill="#10271e" stroke="#50fa7b" stroke-opacity=".58"/>
        <path d="M18 15l-8 9 8 9M30 15l8 9-8 9M27 12l-6 26" fill="none" stroke="#50fa7b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="86" y="70" class="sans cardTitle">CodePolish</text>
      <text x="86" y="92" class="sans" fill="#50fa7b" font-size="12.5" font-weight="600">A VS Code extension for cleaner code</text>
      <text x="24" y="125" class="sans body">
        <tspan x="24" dy="0">A lightweight editor tool for beautifying or minifying</tspan>
        <tspan x="24" dy="20">HTML, CSS, and JavaScript without leaving the</tspan>
        <tspan x="24" dy="20">development workflow.</tspan>
      </text>
      <a href="https://github.com/bharat-poojari/codepolish" target="_blank" rel="noopener">
        <text x="24" y="175" class="sans link">↗ Explore source</text>
      </a>
      <g class="mono" font-size="9.5" font-weight="700" letter-spacing=".8">
        <rect x="24" y="188" width="94" height="23" rx="5" class="chip" stroke="#8be9fd" stroke-opacity=".45"/>
        <text x="71" y="203" fill="#8be9fd" text-anchor="middle">VS CODE</text>
        <rect x="127" y="188" width="108" height="23" rx="5" class="chip" stroke="#f1fa8c" stroke-opacity=".45"/>
        <text x="181" y="203" fill="#f1fa8c" text-anchor="middle">DEV TOOLS</text>
      </g>
    </g>

    <!-- Card 04: more experiments -->
    <g transform="translate(615 462)">
      <rect width="525" height="224" rx="15" fill="#0b111d" fill-opacity=".93" stroke="#ff79c6" stroke-opacity=".3"/>
      <path d="M18 0H95" stroke="#ff79c6" stroke-width="2.4" stroke-linecap="round">
        <animate attributeName="stroke-dasharray" values="0 77;77 0;0 77" dur="6.1s" repeatCount="indefinite"/>
      </path>
      <g class="mono" font-size="10" letter-spacing="1.5">
        <text x="22" y="28" fill="#ff9bd5">PROJECT / 04</text>
        <text x="503" y="28" fill="#70819b" text-anchor="end">LAB / IN PROGRESS</text>
      </g>
      <g transform="translate(23 51)">
        <rect width="48" height="48" rx="12" fill="#2b1427" stroke="#ff79c6" stroke-opacity=".58"/>
        <circle cx="24" cy="24" r="11" fill="none" stroke="#ff9bd5" stroke-width="1.6" stroke-dasharray="3 3">
          <animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24" dur="12s" repeatCount="indefinite"/>
        </circle>
        <path d="M24 17v14M17 24h14" stroke="#ff9bd5" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <text x="86" y="70" class="sans cardTitle">More experiments</text>
      <text x="86" y="92" class="sans" fill="#ff9bd5" font-size="12.5" font-weight="600">Small tools. New ideas. Continuous iteration.</text>
      <text x="24" y="125" class="sans body">
        <tspan x="24" dy="0">I also explore web applications, backend workflows,</tspan>
        <tspan x="24" dy="20">and practical utilities. Browse the repositories to see</tspan>
        <tspan x="24" dy="20">current experiments.</tspan>
      </text>
      <a href="https://github.com/bharat-poojari?tab=repositories" target="_blank" rel="noopener">
        <text x="24" y="175" class="sans link">↗ Browse all repositories</text>
      </a>
      <g class="mono" font-size="9.5" font-weight="700" letter-spacing=".8">
        <rect x="24" y="188" width="78" height="23" rx="5" class="chip" stroke="#8be9fd" stroke-opacity=".45"/>
        <text x="63" y="203" fill="#8be9fd" text-anchor="middle">LEARN</text>
        <rect x="111" y="188" width="92" height="23" rx="5" class="chip" stroke="#ff79c6" stroke-opacity=".45"/>
        <text x="157" y="203" fill="#ff9bd5" text-anchor="middle">ITERATE</text>
      </g>
    </g>

    <!-- CTA footer -->
    <a href="https://bharat-poojari.vercel.app/" target="_blank" rel="noopener">
      <g transform="translate(60 710)">
        <rect x="0" y="-7" width="1080" height="34" rx="8" fill="#101827" stroke="#8be9fd" stroke-opacity=".34"/>
        <text x="540" y="15" text-anchor="middle" class="mono" fill="#d9e7f8" font-size="12" font-weight="700" letter-spacing="2">EXPLORE THE PORTFOLIO <tspan fill="#8be9fd">→</tspan></text>
        <path d="M1 -6H180" stroke="url(#spectrum)" stroke-width="2" stroke-linecap="round">
          <animate attributeName="stroke-dasharray" values="0 180;180 0;0 180" dur="5s" repeatCount="indefinite"/>
        </path>
      </g>
    </a>
    <text x="1140" y="748" text-anchor="end" class="mono" fill="#65758e" font-size="9" letter-spacing="1.5">BUILD / TEST / SHIP</text>
    <rect x=".6" y=".6" width="1198.8" height="758.8" rx="23.4" fill="none" stroke="#8be9fd" stroke-opacity=".22" stroke-width="1.2"/>
  </g>
</svg>

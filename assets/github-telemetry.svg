<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">GitHub telemetry for bharat-poojari</title>
  <desc id="desc">Live GitHub profile statistics for bharat-poojari including public repositories, followers, stars, forks, and recent project activity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a12"/>
      <stop offset="0.55" stop-color="#0d1421"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8be9fd"/>
      <stop offset="0.5" stop-color="#bd93f9"/>
      <stop offset="1" stop-color="#ff79c6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#dfeaf7" stroke-opacity="0.06" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.2" fill="#8be9fd" fill-opacity="0.14"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .label { fill: #8be9fd; font-size: 10px; letter-spacing: 2px; }
      .muted { fill: #9aaaca; }
      .panel { fill: #0b111d; fill-opacity: 0.92; stroke: rgba(158,178,203,0.2); }
      .big { fill: #f4f7fb; font-size: 42px; font-weight: 800; letter-spacing: -2px; }
      .title { fill: #f4f7fb; font-size: 32px; font-weight: 800; letter-spacing: -1.2px; }
      .small { fill: #cbd5e1; font-size: 14px; }
      .stat { fill: #f4f7fb; font-size: 30px; font-weight: 800; }
      .meta { fill: #9aaaca; font-size: 11px; letter-spacing: 1.2px; }
    </style>
  </defs>

  <g>
    <rect width="1200" height="760" fill="url(#bg)"/>
    <rect width="1200" height="760" fill="url(#grid)"/>
    <ellipse cx="980" cy="120" rx="330" ry="250" fill="url(#glow)"/>

    <g class="mono">
      <circle cx="60" cy="50" r="4" fill="#8be9fd">
        <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="76" y="54" fill="#8be9fd" font-size="11" letter-spacing="2.5">GITHUB LIVE DATA / 2026</text>
      <text x="1140" y="54" text-anchor="end" fill="#73839c" font-size="10" letter-spacing="2">PROFILE SIGNAL ? 05</text>
    </g>

    <text x="60" y="120" class="sans title">GitHub <tspan fill="url(#accent)">Telemetry.</tspan></text>
    <text x="60" y="155" class="sans small" fill="#aebbd0">Live profile snapshot from the GitHub API for bharat-poojari</text>

    <g class="mono">
      <rect x="60" y="178" width="240" height="32" rx="8" fill="#0c1c21" stroke="#50fa7b" stroke-opacity="0.45"/>
      <circle cx="78" cy="194" r="4" fill="#50fa7b" filter="url(#softGlow)"/>
      <text x="90" y="199" fill="#8be9fd" font-size="10" letter-spacing="1.1">github.com/bharat-poojari</text>
    </g>

    <g transform="translate(60 238)">
      <rect width="240" height="140" rx="18" class="panel">
        <animate attributeName="stroke-opacity" values=".2;.42;.2" dur="5.2s" repeatCount="indefinite"/>
      </rect>
      <text x="24" y="28" class="label">01 / REPOS</text>
      <text x="24" y="86" class="stat">13</text>
      <text x="24" y="108" class="meta">PUBLIC REPOSITORIES</text>
    </g>

    <g transform="translate(325 238)">
      <rect width="240" height="140" rx="18" class="panel">
        <animate attributeName="stroke-opacity" values=".2;.42;.2" dur="5.8s" repeatCount="indefinite"/>
      </rect>
      <text x="24" y="28" class="label">02 / FOLLOWERS</text>
      <text x="24" y="86" class="stat">0</text>
      <text x="24" y="108" class="meta">PROFILE FOLLOWERS</text>
    </g>

    <g transform="translate(590 238)">
      <rect width="240" height="140" rx="18" class="panel">
        <animate attributeName="stroke-opacity" values=".2;.42;.2" dur="6.4s" repeatCount="indefinite"/>
      </rect>
      <text x="24" y="28" class="label">03 / FOLLOWING</text>
      <text x="24" y="86" class="stat">0</text>
      <text x="24" y="108" class="meta">PEOPLE FOLLOWED</text>
    </g>

    <g transform="translate(855 238)">
      <rect width="285" height="140" rx="18" class="panel">
        <animate attributeName="stroke-opacity" values=".2;.42;.2" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text x="24" y="28" class="label">04 / STARS</text>
      <text x="24" y="86" class="stat">12</text>
      <text x="24" y="108" class="meta">TOTAL REPO STARS</text>
    </g>

    <g transform="translate(60 410)">
      <rect width="520" height="232" rx="18" class="panel"/>
      <text x="24" y="28" class="label">05 / RECENT ACTIVITY</text>
      <text x="24" y="62" class="sans" fill="#f4f7fb" font-size="19" font-weight="700">Latest active repository</text>
      <text x="24" y="92" class="sans" fill="#8be9fd" font-size="18" font-weight="700">bharat-poojari/bharat-poojari</text>
      <text x="24" y="118" class="sans muted" font-size="13">Last update: 2026-10-20</text>
      <text x="24" y="156" class="sans" fill="#f4f7fb" font-size="19" font-weight="700">Profile bio</text>
      <text x="24" y="182" class="sans" fill="#d6deed" font-size="14">Developer • AI Enthusiast • Open Source • Lifelong Learner</text>
    </g>

    <g transform="translate(620 410)">
      <rect width="520" height="232" rx="18" class="panel"/>
      <text x="24" y="28" class="label">06 / TOP REPOS</text>
      <text x="24" y="62" class="sans" fill="#f4f7fb" font-size="19" font-weight="700">Most starred projects</text>
      <g class="mono" fill="#dbe7f7" font-size="14">
        <text x="24" y="95">1. bharat-poojari/Furniqo ? 1?</text><text x="24" y="135">2. bharat-poojari/Bharat-Portfolio ? 1?</text><text x="24" y="175">3. bharat-poojari/shadow-portfolio ? 1?</text>
      </g>
      <g class="mono" font-size="11">
        <text x="24" y="206" fill="#8be9fd">Forks: 0 ? Gists: 0</text>
      </g>
    </g>

    <text x="60" y="700" class="sans muted" font-size="11.5">Metrics are rendered from the public GitHub API and reflect live profile data.</text>
    <text x="1140" y="700" text-anchor="end" class="mono" fill="#71809a" font-size="9.5" letter-spacing="1.5">LIVE ? VERIFIED ? OPEN SOURCE</text>
    <rect x="0.6" y="0.6" width="1198.8" height="758.8" rx="23.4" fill="none" stroke="#8be9fd" stroke-opacity="0.2" stroke-width="1.2"/>
  </g>
</svg>

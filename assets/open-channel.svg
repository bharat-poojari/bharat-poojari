<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">07 / Open Channel — Bharat Poojari</title>
<desc id="desc">A standalone animated contact section with links to email, portfolio, GitHub repositories, and a back-to-source link.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".6" stop-color="#14152a"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff79c6"/><stop offset="1" stop-color="#bd93f9"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#50fa7b"/><stop offset="1" stop-color="#8affc3"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8be9fd"/><stop offset="1" stop-color="#bd93f9"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8be9fd" stroke-opacity=".07" stroke-width="1"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .white{fill:#f8f8ff}.muted{fill:#a6a9c1}.pink{fill:#ff79c6}.green{fill:#50fa7b}.cyan{fill:#8be9fd}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.6px}
    .btn{fill:#141a30;stroke:#4a4f70;stroke-width:1.2;transition:fill .25s,stroke .25s}
    a:hover .btn{fill:#222a46;stroke:#ff79c6}
    a:hover .label{filter:url(#glow)}
    .bob{animation:bob 4.8s ease-in-out infinite}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    .orbit{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
    .dash{stroke-dasharray:8 10;animation:dash 18s linear infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes dash{to{stroke-dashoffset:-360}}
    @media (prefers-reduced-motion:reduce){.bob,.pulse,.orbit,.dash{animation:none}}
  </style>
</defs>
<rect width="1440" height="850" fill="url(#bg)"/>
<rect width="1440" height="850" fill="url(#grid)"/>
<circle cx="1185" cy="190" r="235" fill="#ff79c6" opacity=".045"/>
<circle cx="1185" cy="190" r="170" fill="none" stroke="#ff79c6" stroke-opacity=".22" stroke-dasharray="3 10" class="orbit"/>
<circle cx="1185" cy="190" r="120" fill="none" stroke="#8be9fd" stroke-opacity=".15" stroke-dasharray="4 12" class="orbit"/>
<path d="M80 100H1360" stroke="#656b91" stroke-opacity=".55"/>
<g transform="translate(94 67)">
  <rect width="5" height="24" rx="2.5" fill="url(#pink)"/>
  <text x="20" y="17" class="mono pink" font-size="13" font-weight="700">07 / OPEN CHANNEL</text>
</g>
<text x="94" y="190" class="white" font-size="72" font-weight="750" letter-spacing="-3">Have a good</text>
<text x="94" y="270" class="white" font-size="72" font-weight="750" letter-spacing="-3">idea? <tspan fill="url(#pink)">Let's talk.</tspan></text>
<text x="98" y="320" class="muted" font-size="18">Have an idea, collaboration, project opportunity,</text>
<text x="98" y="348" class="muted" font-size="18">or want to discuss technology? Get in touch.</text>

<!-- connection motif -->
<g transform="translate(1050 205)" class="bob">
  <circle r="56" fill="#ff79c6" fill-opacity=".07" stroke="#ff79c6" stroke-opacity=".6"/>
  <circle r="38" fill="none" stroke="#8be9fd" stroke-opacity=".6" stroke-dasharray="3 6" class="orbit"/>
  <path d="M-19 -4L-3 -19L13 -4L-3 11Z" fill="none" stroke="#ff79c6" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M-3 11V24M13 -4H26" stroke="#8be9fd" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="26" cy="-4" r="4" fill="#8be9fd" filter="url(#glow)"/>
  <circle cx="-3" cy="24" r="4" fill="#50fa7b" filter="url(#glow)"/>
</g>
<path d="M94 396H1346" stroke="#656b91" stroke-opacity=".65"/>
<text x="94" y="440" class="mono muted" font-size="12">CHOOSE A CHANNEL</text>

<!-- Clickable contact cards -->
<a href="mailto:bharatp0316@gmail.com" target="_blank" rel="noopener noreferrer" aria-label="Email Bharat">
  <g transform="translate(94 472)">
    <rect class="btn" width="390" height="142" rx="15"/>
    <rect x="0" y="0" width="5" height="142" rx="2.5" fill="url(#pink)"/>
    <g transform="translate(28 29)" fill="none" stroke="#ff79c6" stroke-width="2" stroke-linejoin="round">
      <rect width="35" height="25" rx="4"/><path d="M2 3L17.5 15L33 3"/>
    </g>
    <text x="28" y="88" class="mono pink" font-size="11" font-weight="700">EMAIL / SAY HELLO</text>
    <text x="28" y="114" class="white label" font-size="18" font-weight="650">bharatp0316@gmail.com</text>
    <text x="354" y="38" class="pink" font-size="22">↗</text>
  </g>
</a>
<a href="https://bharat-poojari.vercel.app/" target="_blank" rel="noopener noreferrer" aria-label="Visit portfolio">
  <g transform="translate(525 472)">
    <rect class="btn" width="390" height="142" rx="15"/>
    <rect x="0" y="0" width="5" height="142" rx="2.5" fill="url(#green)"/>
    <g transform="translate(29 27)" fill="none" stroke="#50fa7b" stroke-width="2">
      <circle cx="17" cy="15" r="15"/><path d="M2 15H32M17 0C8 8 8 22 17 30M17 0C26 8 26 22 17 30"/>
    </g>
    <text x="28" y="88" class="mono green" font-size="11" font-weight="700">PORTFOLIO / EXPLORE</text>
    <text x="28" y="114" class="white label" font-size="20" font-weight="650">View my portfolio</text>
    <text x="354" y="38" class="green" font-size="22">↗</text>
  </g>
</a>
<a href="https://github.com/bharat-poojari?tab=repositories" target="_blank" rel="noopener noreferrer" aria-label="Browse repositories">
  <g transform="translate(956 472)">
    <rect class="btn" width="390" height="142" rx="15"/>
    <rect x="0" y="0" width="5" height="142" rx="2.5" fill="url(#cyan)"/>
    <g transform="translate(29 25)" fill="none" stroke="#8be9fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 6L1 15L9 24M25 6L33 15L25 24M20 2L14 28"/>
    </g>
    <text x="28" y="88" class="mono cyan" font-size="11" font-weight="700">REPOSITORIES / BROWSE</text>
    <text x="28" y="114" class="white label" font-size="20" font-weight="650">Explore my GitHub</text>
    <text x="354" y="38" class="cyan" font-size="22">↗</text>
  </g>
</a>

<g transform="translate(94 682)">
  <circle cx="7" cy="0" r="4" fill="#50fa7b" class="pulse"/>
  <text x="22" y="5" class="mono muted" font-size="11">OPEN TO IDEAS · COLLABORATION · CONVERSATION</text>
</g>
<path d="M94 734H1346" stroke="url(#pink)" stroke-opacity=".75" class="dash"/>
<text x="94" y="781" class="white" font-size="18" font-weight="650" letter-spacing="1.1">BUILD WITH CURIOSITY <tspan class="pink">·</tspan> SHIP WITH INTENTION</text>
<a href="https://github.com/bharat-poojari" target="_blank" rel="noopener noreferrer" aria-label="Back to the source">
  <text x="1346" y="781" class="cyan mono" font-size="12" font-weight="700" text-anchor="end">BACK TO THE SOURCE ↗</text>
</a>
<text x="94" y="822" class="muted mono" font-size="10">BHARAT POOJARI / OPEN CHANNEL</text>
<circle cx="1324" cy="66" r="3.5" fill="#ff79c6" filter="url(#glow)" class="pulse"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Build with curiosity. Ship with intention.</title>
  <desc id="desc">A cyberpunk-inspired developer footer with animated neon orbital paths, a glowing central core, and a futuristic dark interface.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset=".5" stop-color="#10152b"/>
      <stop offset="1" stop-color="#080b19"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8be9fd" stop-opacity="0"/>
      <stop offset=".25" stop-color="#8be9fd"/>
      <stop offset=".5" stop-color="#bd93f9"/>
      <stop offset=".75" stop-color="#ff79c6"/>
      <stop offset="1" stop-color="#ff79c6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#8be9fd"/>
      <stop offset="1" stop-color="#8be9fd" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8be9fd" stroke-opacity=".07" stroke-width=".6"/>
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="220"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="220" fill="url(#background)"/>
    <rect width="1200" height="220" fill="url(#grid)"/>

    <!-- Ambient light -->
    <ellipse cx="600" cy="108" rx="320" ry="105" fill="#8be9fd" opacity=".035"/>
    <ellipse cx="600" cy="108" rx="190" ry="75" fill="#bd93f9" opacity=".045"/>

    <!-- Outer frame -->
    <rect x="1" y="1" width="1198" height="218" rx="15"
          fill="none" stroke="url(#neon)" stroke-opacity=".65"/>

    <!-- HUD corner marks -->
    <g fill="none" stroke="#8be9fd" stroke-width="1.2" opacity=".8">
      <path d="M24 42V24H74 M1126 24H1176V42"/>
      <path d="M24 178V196H74 M1126 196H1176V178"/>
    </g>

    <!-- Orbital paths -->
    <g fill="none" stroke="url(#neon)" stroke-width="1.4">
      <path d="M45 110 C220 18 390 18 600 110 S980 202 1155 110"
            opacity=".8"/>
      <path d="M45 110 C220 202 390 202 600 110 S980 18 1155 110"
            opacity=".6"/>
      <path d="M70 110H1130" stroke-dasharray="3 8" opacity=".6"/>
    </g>

    <!-- Animated energy traces -->
    <g fill="none" stroke="#8be9fd" stroke-width="1.6" filter="url(#glow)">
      <path d="M90 110 C260 25 410 35 600 110"
            stroke-dasharray="12 22">
        <animate attributeName="stroke-dashoffset"
                 from="0" to="-136" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M1110 110 C940 195 790 185 600 110"
            stroke-dasharray="12 22">
        <animate attributeName="stroke-dashoffset"
                 from="0" to="136" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Central reactor -->
    <g transform="translate(600 110)">
      <circle r="44" fill="none" stroke="#8be9fd" stroke-opacity=".18"/>
      <circle r="34" fill="none" stroke="#8be9fd" stroke-opacity=".6"
              stroke-dasharray="3 7">
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>

      <circle r="24" fill="none" stroke="#bd93f9" stroke-width="1.2"
              stroke-dasharray="35 14 8 14">
        <animateTransform attributeName="transform" type="rotate"
                          from="360" to="0" dur="12s" repeatCount="indefinite"/>
      </circle>

      <circle r="22" fill="url(#core)" opacity=".8">
        <animate attributeName="r" values="18;28;18"
                 dur="3s" repeatCount="indefinite"/>
      </circle>

      <circle r="5" fill="#ffffff" filter="url(#glow)">
        <animate attributeName="opacity" values=".65;1;.65"
                 dur="2s" repeatCount="indefinite"/>
      </circle>

      <path d="M-58 0H58 M0-58V58"
            stroke="#8be9fd" stroke-opacity=".35" stroke-width=".8"/>
    </g>

    <!-- Signal nodes -->
    <g filter="url(#glow)">
      <circle cx="100" cy="110" r="2.5" fill="#8be9fd">
        <animate attributeName="r" values="2;3.5;2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="310" cy="68" r="2" fill="#8be9fd">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="890" cy="152" r="2" fill="#bd93f9">
        <animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1100" cy="110" r="2.5" fill="#ff79c6">
        <animate attributeName="r" values="2;3.5;2" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Header -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       text-anchor="middle">
      <text x="600" y="34" font-size="10" letter-spacing="4"
            fill="#8be9fd">END OF TRANSMISSION</text>

      <text x="600" y="184" font-size="13" font-weight="600"
            letter-spacing="2" fill="#dce6f6">
        BUILD WITH CURIOSITY
      </text>

      <text x="600" y="204" font-size="10" letter-spacing="2"
            fill="#bd93f9">SHIP WITH INTENTION</text>
    </g>

    <!-- Moving signal -->
    <circle r="3" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="7s" repeatCount="indefinite"
        path="M70 110 C250 20 420 20 600 110 S950 200 1130 110"/>
    </circle>
  </g>
</svg>

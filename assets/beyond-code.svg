<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Beyond the Code — Bharat Poojari</title>
<desc id="desc">Compact animated cyberpunk portfolio section with education, location, mindset, software philosophy and working principles.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030815"/><stop offset=".52" stop-color="#07152a"/><stop offset="1" stop-color="#020712"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#57f4ff"/><stop offset=".5" stop-color="#159dff"/><stop offset="1" stop-color="#465dff"/></linearGradient>
  <linearGradient id="fadeLine"><stop stop-color="#1b8dff" stop-opacity="0"/><stop offset=".5" stop-color="#47eaff"/><stop offset="1" stop-color="#1b8dff" stop-opacity="0"/></linearGradient>
  <radialGradient id="planet"><stop stop-color="#124d9d"/><stop offset=".65" stop-color="#08234b"/><stop offset="1" stop-color="#020917"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b82c9" stroke-opacity=".075"/><circle cx="0" cy="0" r="1" fill="#41dcff" fill-opacity=".25"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .white{fill:#f3f8ff}.muted{fill:#91a9ca}.cyan{fill:#52eaff}.blue{fill:#3d9dff}
    .label{font-size:11px;font-weight:750;letter-spacing:2.1px}.micro{font-size:10px;font-weight:650;letter-spacing:1.6px}
    .panel{fill:#071327;fill-opacity:.88;stroke:#174c79;stroke-width:1.2;transition:stroke .3s,fill-opacity .3s,transform .3s}
    .cardTop{stroke:url(#neon);stroke-width:2.2}
    .scan{animation:scan 5s ease-in-out infinite}.float{animation:float 4.8s ease-in-out infinite}.float2{animation:float 4.8s ease-in-out -2.4s infinite}
    .pulse{animation:pulse 2.7s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 22s linear infinite}
    .orbitReverse{transform-box:fill-box;transform-origin:center;animation:orbit 16s linear infinite reverse}.draw{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 2.2s cubic-bezier(.2,.7,.2,1) .3s forwards}
    .spark{animation:spark 3.2s ease-in-out infinite}.card:hover .panel{stroke:#53eaff;fill-opacity:1}.codeFloat{animation:codeFloat 6s ease-in-out infinite}.typeCursor{animation:cursorBlink 1s steps(2,start) infinite}.codeScan{animation:codeScan 4.5s ease-in-out infinite;stroke-dasharray:48 420;stroke-dashoffset:468}.glyph{animation:glyphPulse 3.8s ease-in-out infinite}.card:hover .panel{transform:translateY(-2px)}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes scan{0%,100%{transform:translateX(-180px);opacity:0}25%,70%{opacity:.8}85%{transform:translateX(500px);opacity:0}}
    @keyframes spark{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
    @keyframes codeFloat{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-8px);opacity:1}}
    @keyframes cursorBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes codeScan{0%{stroke-dashoffset:468;opacity:0}20%{opacity:1}75%{opacity:.9}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes glyphPulse{0%,100%{opacity:.3}50%{opacity:.9}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
  </style>
</defs>
<!-- Atmosphere -->
<rect width="1440" height="860" fill="url(#bg)"/><rect width="1440" height="860" fill="url(#grid)"/>
<circle cx="1190" cy="160" r="190" fill="#0879ff" opacity=".07" filter="url(#softGlow)"><animate attributeName="opacity" values=".035;.09;.035" dur="7s" repeatCount="indefinite"/></circle>
<path d="M0 108H1440M0 826H1440" stroke="url(#fadeLine)" stroke-width="1"/>
<path d="M44 130V796M1396 130V796" stroke="#2379b4" stroke-opacity=".22" stroke-dasharray="2 8"/>
<!-- Header -->
<g transform="translate(66 58)"><path d="M0 0H32L42 10V38L32 48H0L-8 40V8Z" fill="#07182d" stroke="url(#neon)"/><text x="17" y="31" text-anchor="middle" class="cyan" font-size="19" font-weight="800">06</text><text x="58" y="28" class="label white">BEYOND THE <tspan class="cyan">CODE</tspan></text><path d="M226 22H660" stroke="url(#fadeLine)"/><circle cx="445" cy="22" r="3" fill="#52eaff" filter="url(#glow)" class="pulse"/></g>
<text x="68" y="177" class="white" font-size="57" font-weight="760" letter-spacing="-2.8">The person behind</text>
<text x="68" y="236" class="white" font-size="57" font-weight="760" letter-spacing="-2.8">the <tspan fill="url(#neon)">process.</tspan></text>
<text x="72" y="270" class="muted" font-size="15.5">A few things that shape how I think, build, and keep improving.</text>
<path d="M72 289H475" stroke="url(#neon)" stroke-width="2" class="draw"/>
<!-- Orbital emblem -->
<g transform="translate(1138 174)">
  <circle r="95" fill="#0b2e5a" opacity=".2"/>
  <circle r="72" fill="url(#planet)" stroke="#1c9fff" stroke-width="1.3"/>
  <circle r="72" fill="none" stroke="#53eaff" stroke-opacity=".65" stroke-width="1" filter="url(#glow)"/>
  <path d="M-55 -23Q0 -54 57 -20M-64 8Q0 -15 64 8M-44 42Q0 21 44 42" fill="none" stroke="#2b91ff" stroke-opacity=".7" stroke-width="1"/>
  <ellipse rx="119" ry="38" fill="none" stroke="#198eff" stroke-width="1.5" transform="rotate(-23)" class="orbit"/>
  <ellipse rx="106" ry="29" fill="none" stroke="#53eaff" stroke-opacity=".85" stroke-width="1.2" transform="rotate(28)" class="orbitReverse"/>
  <circle cx="-109" cy="-48" r="4" fill="#53eaff" filter="url(#glow)" class="spark"/><circle cx="105" cy="-42" r="4" fill="#238fff" filter="url(#glow)" class="pulse"/>
  <g transform="translate(-228 72)" class="codeFloat"><text x="0" y="0" class="micro cyan" opacity=".85">&lt;code&gt;</text><text x="0" y="17" class="micro muted" opacity=".8">const idea = build();</text><path d="M0 27H94" stroke="#258dff" stroke-opacity=".65"/><text x="0" y="42" class="micro blue" opacity=".85">return improve;</text></g>
  <path d="M-248 92H-140" class="codeScan" fill="none" stroke="#52eaff" stroke-width="1.5" filter="url(#glow)"/>
  <g transform="translate(143 -38)"><rect width="82" height="25" rx="5" fill="#06162b" stroke="#1a83d5"/><text x="41" y="16" text-anchor="middle" class="micro cyan">BUILD</text></g>
  <g transform="translate(151 -4)"><rect width="82" height="25" rx="5" fill="#06162b" stroke="#1a83d5"/><text x="41" y="16" text-anchor="middle" class="micro white">LEARN</text></g>
  <g transform="translate(139 30)"><rect width="94" height="25" rx="5" fill="#06162b" stroke="#1a83d5"/><text x="47" y="16" text-anchor="middle" class="micro white">REFINE</text></g>
</g>
<!-- Compact information cards -->
<g class="card" transform="translate(66 319)"><rect class="panel" width="414" height="174" rx="12"/><path d="M12 1H402" class="cardTop"/><path d="M12 1H402" class="codeScan" fill="none" stroke="#52eaff" stroke-width="1.5"/><path d="M1 26V12Q1 1 12 1M402 173H390" fill="none" stroke="#53eaff" stroke-opacity=".8"/>
  <g transform="translate(26 36)" class="float"><path d="M0 14L32 0L64 14L32 29Z" fill="none" stroke="#52eaff" stroke-width="2"/><path d="M11 20V39Q32 54 53 39V20M64 14V39" fill="none" stroke="#52eaff" stroke-width="2"/><circle cx="64" cy="42" r="3" fill="#52eaff"/></g>
  <text x="112" y="39" class="label cyan">01 / EDUCATION</text><text x="112" y="72" class="white" font-size="18" font-weight="720">Bachelor of Computer</text><text x="112" y="94" class="white" font-size="18" font-weight="720">Applications</text><path d="M112 111H382" stroke="#1c4264"/><text x="112" y="132" class="micro muted">FOUNDATION IN COMPUTING</text><circle cx="384" cy="151" r="3" fill="#52eaff" class="pulse"/>
</g>
<g class="card" transform="translate(513 319)"><rect class="panel" width="414" height="174" rx="12"/><path d="M12 1H402" class="cardTop"/><path d="M12 1H402" class="codeScan" fill="none" stroke="#52eaff" stroke-width="1.5"/><path d="M1 26V12Q1 1 12 1M402 173H390" fill="none" stroke="#53eaff" stroke-opacity=".8"/>
  <g transform="translate(31 33)" class="float2"><path d="M30 0C13 0 2 13 2 30C2 51 30 70 30 70S58 51 58 30C58 13 47 0 30 0Z" fill="none" stroke="#52eaff" stroke-width="2"/><circle cx="30" cy="29" r="9" fill="none" stroke="#52eaff" stroke-width="2"/></g>
  <text x="112" y="39" class="label cyan">02 / BASE</text><text x="112" y="75" class="white" font-size="19" font-weight="720">Sirsi, Karnataka, India</text><path d="M112 95H382" stroke="#1c4264"/><text x="112" y="118" class="micro muted">ROOTED LOCALLY</text><text x="112" y="137" class="micro muted">BUILDING FOR EVERYWHERE</text><circle cx="384" cy="151" r="3" fill="#52eaff" class="pulse"/>
</g>
<g class="card" transform="translate(960 319)"><rect class="panel" width="414" height="174" rx="12"/><path d="M12 1H402" class="cardTop"/><path d="M12 1H402" class="codeScan" fill="none" stroke="#52eaff" stroke-width="1.5"/><path d="M1 26V12Q1 1 12 1M402 173H390" fill="none" stroke="#53eaff" stroke-opacity=".8"/>
  <g transform="translate(27 39)" class="float"><path d="M31 0C19 0 16 10 16 10C4 10 0 20 6 28C0 36 6 46 17 45C20 55 30 53 31 46C33 53 44 55 47 45C58 46 64 36 57 28C63 20 58 10 47 10C44 2 37 0 31 0Z" fill="none" stroke="#52eaff" stroke-width="2"/><path d="M31 7V47M16 18Q24 17 25 24M11 33Q22 29 25 36M46 18Q38 17 37 24M51 33Q40 29 37 36" fill="none" stroke="#52eaff" stroke-width="1.7"/></g>
  <text x="112" y="39" class="label cyan">03 / MINDSET</text><text x="112" y="79" class="white" font-size="19" font-weight="720">Build <tspan class="cyan">→</tspan> Learn <tspan class="cyan">→</tspan> Refine</text><path d="M112 99H382" stroke="#1c4264"/><text x="112" y="123" class="micro muted">A CONTINUOUS LOOP</text><text x="112" y="143" class="micro muted">ITERATE · MEASURE · IMPROVE</text><circle cx="384" cy="151" r="3" fill="#52eaff" class="pulse"/>
</g>
<!-- Philosophy + principles in one compact horizontal module -->
<g transform="translate(66 519)"><rect width="1308" height="226" rx="14" fill="#061226" fill-opacity=".94" stroke="#1c5784"/><path d="M12 1H1296" stroke="url(#neon)" stroke-width="2"/><path d="M0 35V13Q0 0 13 0M1308 191V213Q1308 226 1295 226" fill="none" stroke="#52eaff" stroke-width="2"/>
  <g transform="translate(32 30)"><text x="0" y="12" class="label cyan">WHAT I BELIEVE</text><text x="0" y="54" class="white" font-size="25" font-weight="700" letter-spacing="-.7">Good software lives where</text><text x="0" y="88" class="white" font-size="20.5" font-weight="750" letter-spacing="-.55" textLength="526" lengthAdjust="spacingAndGlyphs"><tspan class="cyan">usefulness</tspan><tspan fill="#6683a8"> × </tspan><tspan>engineering</tspan><tspan fill="#6683a8"> × </tspan><tspan class="cyan">experience.</tspan></text><path d="M0 111H530" stroke="url(#neon)" stroke-width="2" class="draw"/><text x="0" y="137" class="muted" font-size="11.5">Useful by design. Reliable by engineering. Memorable by experience.</text><g transform="translate(0 158)" class="codeFloat"><text x="0" y="0" class="micro cyan">{ logic }</text><text x="88" y="0" class="micro muted">&lt;/&gt;</text><text x="148" y="0" class="micro blue">0101</text><text x="214" y="0" class="micro muted">function()</text><rect x="288" y="-9" width="2" height="12" fill="#52eaff" class="typeCursor"/></g></g>
  <path d="M590 28V198" stroke="#1c4264"/>
  <g transform="translate(620 30)"><text x="0" y="12" class="label cyan">THE KIND OF WORK I VALUE</text>
    <g transform="translate(0 40)"><circle cx="15" cy="15" r="14" fill="#0b2c4c" stroke="#38bfff"/><path d="M8 15L13 20L22 10" fill="none" stroke="#52eaff" stroke-width="2" stroke-linecap="round"/><text x="40" y="12" class="white" font-size="14" font-weight="700">Solve real problems</text><text x="40" y="33" class="muted" font-size="11.5">Purpose over complexity.</text></g>
    <path d="M0 94H210" stroke="#1c4264"/>
    <g transform="translate(0 107)"><circle cx="15" cy="15" r="14" fill="#0b2c4c" stroke="#38bfff"/><path d="M8 15H22M15 8V22" stroke="#52eaff" stroke-width="2" stroke-linecap="round"/><text x="40" y="12" class="white" font-size="14" font-weight="700">Simplify workflows</text><text x="40" y="33" class="muted" font-size="11.5">Make the useful path natural.</text></g>
    <path d="M240 40V171" stroke="#1c4264"/>
    <g transform="translate(266 40)"><circle cx="15" cy="15" r="14" fill="#0b2c4c" stroke="#38bfff"/><path d="M7 21Q8 13 15 13Q22 13 23 21M15 10A4 4 0 1 0 15 2A4 4 0 1 0 15 10" fill="none" stroke="#52eaff" stroke-width="1.8"/><text x="40" y="12" class="white" font-size="14" font-weight="700">Create lasting value</text><text x="40" y="33" class="muted" font-size="11.5">Thoughtful experiences earn return use.</text></g>
  </g>
</g>
<!-- Footer -->
<path d="M66 785H1374" stroke="#1d5078"/><path d="M66 785H245" stroke="url(#neon)" stroke-width="2"/>
<text x="66" y="815" class="cyan" font-size="20" font-weight="700">&lt;/&gt;</text><text x="104" y="812" class="micro muted">CURIOUS BY DEFAULT</text>
<path d="M325 808H1040" stroke="url(#fadeLine)"/><circle cx="682" cy="808" r="3" fill="#52eaff" filter="url(#glow)" class="spark"/>
<text x="1374" y="812" class="micro white" text-anchor="end">BUILD WITH INTENT <tspan class="cyan">·</tspan> IMPROVE WITH FEEDBACK</text>
<g transform="translate(1268 58)" class="glyph"><text x="0" y="0" class="micro cyan">01</text><text x="24" y="0" class="micro blue">10</text><text x="48" y="0" class="micro cyan">&lt;/&gt;</text></g><circle cx="1368" cy="58" r="3" fill="#52eaff" filter="url(#glow)" class="pulse"/>
</svg>
